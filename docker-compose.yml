version: '3.8'

services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laser-focused-rag:latest
    container_name: rag_app
    # 環境変数を安全に管理するため、.envファイルを読み込む
    env_file:
      - .env
    volumes:
      # ホスト側で生成したFAISSベクトルDBをコンテナ内にマウントし、
      # コンテナ再起動時にデータが失われないようにする
      - ./vectorstore:/app/vectorstore
      - ./sample_data.txt:/app/sample_data.txt
    # app.py をCLIとしてインタラクティブに実行するための設定
    stdin_open: true
    tty: true
