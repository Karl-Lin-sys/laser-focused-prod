version: '3.8'
services:
  rag-app:
    build: .
    container_name: multilingual_rag_app
    environment:
      # Use .env file or system environment variables securely
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    stdin_open: true # allows interactive shell (e.g. input())
    tty: true
    # Run the ingestion script on startup, then keep the container alive for app.py
    command: >
      bash -c "python ingest.py && python app.py"
