name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          # 構文エラーや未定義名がある場合はビルドを停止
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # その他のエラーは警告として扱う (複雑度や文字数制限など)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Tokenization Pytest
        run: |
          pytest tests/

  build-docker:
    needs: test-and-lint
    runs-on: ubuntu-latest
    # テストとLintが成功した場合のみDockerイメージをビルドする
    if: success()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t laser-focused-rag:latest .
          # 本番環境ではここでGHCRやDocker Hubへプッシュします
          # docker push myregistry/laser-focused-rag:latest
